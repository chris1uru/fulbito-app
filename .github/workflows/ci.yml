name: App CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - name: Bundle iOS, Android and web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: npx expo export --platform all --output-dir dist-ci
